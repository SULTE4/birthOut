[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "birthout"
version = "0.1.0"
description = "Extract birthdays from WhatsApp exports and review them before Google Calendar sync"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "platformdirs>=4.2,<5",
  "keyring>=25,<26",
  "google-api-python-client>=2.140,<3",
  "google-auth-oauthlib>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1"]

[project.scripts]
birthout = "birthout.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/birthout"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
